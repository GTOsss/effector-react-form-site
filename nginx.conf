server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;

    # HTML и page-data не кэшируем — иначе после деплоя пользователи увидят старую версию
    location ~* \.html$ {
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    location /page-data/ {
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    # Файлы с хэшем в имени можно кэшировать навсегда
    location /static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~* \.(?:js|css)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /sw.js {
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;
}
