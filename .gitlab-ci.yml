stages:
  - build
  - test

variables:
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""

default:
  image: docker:29.5.3-cli
  services:
    - docker:29.5.3-dind


build-image:
  tags:
    - laptop-dc
  stage: build
  script:
    - IMAGE_TAG=$(date +%Y-%m-%d-%H-%M)
    - echo "Версия сборки — $IMAGE_TAG"
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker build -t $CI_REGISTRY_IMAGE:$IMAGE_TAG .
    - docker push $CI_REGISTRY_IMAGE:$IMAGE_TAG
    - docker tag $CI_REGISTRY_IMAGE:$IMAGE_TAG $CI_REGISTRY_IMAGE:latest
    - docker push $CI_REGISTRY_IMAGE:latest

test-image:
  tags:
    - laptop-dc
  stage: test
  script:
    - apk add --no-cache curl
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker run -d --name effector-react-form-site -p 8080:80 $CI_REGISTRY_IMAGE:latest
    # Порт публикуется на хосте dind-сервиса, поэтому стучимся в docker, а не в localhost
    - curl --fail --silent --show-error --retry 10 --retry-delay 2 --retry-connrefused http://docker:8080
  after_script:
    - docker logs effector-react-form-site || true
    - docker rm -f effector-react-form-site || true